# Nombre de la app y mensajes (esto puedes dejarlo igual)
spring.application.name=fichar
app.greeting=Hello
app.default-name=World

# Configuración JPA (mantén esto como prefieras)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# DATOS DE CONEXIÓN DINÁMICOS USANDO VARIABLES DE ENTORNO
spring.datasource.url=${{ MySQL.MYSQL_URL }}
spring.datasource.username=${DB_USER}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# USUARIO DE SPRING SECURITY (también dinámico)
spring.security.secret=${SPRING_SECRET}
